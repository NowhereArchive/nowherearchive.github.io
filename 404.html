<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="The Path to Nowhere Archive has been taken down following a DMCA notice."
    />
    <title>Path To Nowhere Archive — Notice</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-702GZFHJQE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-702GZFHJQE');
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Lato, Roboto, Arial, sans-serif;
        color: #e0e0e0;
        background: #0a0a0a;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 34%, #241111 0, transparent 47%),
          #0a0a0a;
      }

      .site-header {
        min-height: 4.25rem;
        display: flex;
        align-items: center;
        padding: 0 1.5rem;
        border-bottom: 1px solid #ffffff1a;
        background: #121212;
      }

      .site-name {
        width: min(100%, 1100px);
        margin: 0 auto;
        color: #f3eeee;
        font-family: Roboto, Lato, Arial, sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      main {
        display: grid;
        min-height: calc(100vh - 4.25rem);
        place-items: center;
        padding: 3rem 1.5rem 5rem;
      }

      .notice {
        width: min(100%, 720px);
        padding: clamp(1.5rem, 5vw, 3.25rem);
        border: 1px solid #ffffff1a;
        border-left: 3px solid #9c1111;
        background: #121212;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 1.5rem;
        color: #d58a8a;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .status::before {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #c94b4b;
        content: "";
      }

      h1 {
        max-width: 14ch;
        margin: 0;
        color: #fff;
        font-size: clamp(2.2rem, 7vw, 4rem);
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1.06;
        text-wrap: balance;
      }

      .message {
        max-width: 54ch;
        margin: 1.5rem 0 0;
        color: #bdb7b7;
        font-size: clamp(1rem, 2vw, 1.1rem);
        line-height: 1.75;
      }

      @media (max-width: 480px) {
        .site-header {
          min-height: 3.75rem;
          padding-inline: 1rem;
        }

        main {
          min-height: calc(100vh - 3.75rem);
          padding: 2rem 1rem 3rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <p class="site-name">Path To Nowhere Archive</p>
    </header>
    <main>
      <section class="notice" aria-labelledby="notice-title">
        <p class="status">Site unavailable</p>
        <h1 id="notice-title">This site has been taken down.</h1>
        <p class="message">
          The Path to Nowhere Archive has been taken down following a DMCA
          notice. The fan site is no longer available.
        </p>
      </section>
    </main>
  </body>
</html>
